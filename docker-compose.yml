services:
  mysql:
    image: mysql:8.4
    container_name: eletro-stock-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: eletro_stock
      MYSQL_USER: eletro
      MYSQL_PASSWORD: eletrostock
      MYSQL_ROOT_PASSWORD: eletrostock
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - eletro_stock_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ueletro", "-peletrostock"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  eletro_stock_mysql:
